[project]
name = "xiaomi-s400-homeassistant"
version = "0.3.0"
description = "Fully local Xiaomi S400 BLE integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=41",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-homeassistant-custom-component==0.13.367",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  # Pin the Bluetooth stack to the versions Home Assistant 2026.9.4 requires.
  # Custom integrations declare no requirements; the test env has to provide them.
  "bleak==3.0.2",
  "bleak-retry-connector==4.7.0",
  "bluetooth-adapters==2.4.0",
  "bluetooth-auto-recovery==1.6.4",
  "bluetooth-data-tools==1.29.24",
  "dbus-fast==5.0.22",
  "habluetooth==6.26.11",
  "aiousbwatcher==1.1.2",
  "serialx==1.10.0",
  "fnv-hash-fast==2.0.3",
  "psutil-home-assistant==0.0.1",
  "mypy>=1.11,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=custom_components/xiaomi_s400_local --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["custom_components/xiaomi_s400_local"]
